<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0e1526"/>
  <rect x="50" y="50" width="700" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="100" font-family="monospace" font-size="16" fill="#a855f7" text-anchor="middle">ARIA Agent Interaction Flow</text>
  <rect x="80" y="140" width="140" height="90" rx="6" fill="#070b14" stroke="#34d399" stroke-width="2"/>
