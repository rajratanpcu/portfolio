  <path d="M690 185 Q 580 280 400 280 Q 220 280 150 185" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#a4)"/>
  <text x="400" y="300" font-family="monospace" font-size="10" fill="#a855f7" text-anchor="middle">AFP Feedback Loop: Production Incidents → Upstream Risk Scores</text>
  <rect x="300" y="350" width="200" height="80" rx="6" fill="#070b14" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="375" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">IRA</text>
  <text x="400" y="395" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Incident Response</text>
  <text x="400" y="415" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Root Cause Attribution</text>
  <defs>
