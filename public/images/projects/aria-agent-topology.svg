  <line x1="400" y1="185" x2="440" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="440" y="140" width="140" height="90" rx="6" fill="#070b14" stroke="#818cf8" stroke-width="2"/>
  <text x="510" y="165" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle">RCA</text>
  <text x="510" y="185" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Release Policy</text>
  <text x="510" y="205" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Go/No-Go Gate</text>
  <line x1="580" y1="185" x2="620" y2="185" stroke="#818cf8" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="620" y="140" width="140" height="90" rx="6" fill="#070b14" stroke="#fbbf24" stroke-width="2"/>
