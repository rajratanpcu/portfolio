  <text x="150" y="185" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Build Risk Score</text>
  <text x="150" y="205" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Code Delta Analysis</text>
  <line x1="220" y1="185" x2="260" y2="185" stroke="#34d399" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="260" y="140" width="140" height="90" rx="6" fill="#070b14" stroke="#38bdf8" stroke-width="2"/>
  <text x="330" y="165" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">COA</text>
  <text x="330" y="185" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Dynamic Test Suite</text>
