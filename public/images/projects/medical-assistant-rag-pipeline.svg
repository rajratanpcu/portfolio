  <text x="400" y="395" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Rerank Top-K</text>
  <line x1="400" y1="410" x2="400" y2="450" stroke="#fbbf24" stroke-width="2" marker-end="url(#a5)"/>
