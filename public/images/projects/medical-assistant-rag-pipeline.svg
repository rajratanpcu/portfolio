  <text x="510" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">pgvector</text>
  <line x1="580" y1="170" x2="620" y2="170" stroke="#34d399" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="620" y="130" width="100" height="80" rx="4" fill="#070b14" stroke="#fbbf24" stroke-width="2"/>
