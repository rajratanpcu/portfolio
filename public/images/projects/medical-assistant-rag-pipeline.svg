  <text x="330" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">BioBERT / ClinicalBERT</text>
  <line x1="400" y1="170" x2="440" y2="170" stroke="#818cf8" stroke-width="2" marker-end="url(#a2)"/>
