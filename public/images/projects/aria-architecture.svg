<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0e1526"/>
  <rect x="50" y="50" width="700" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="400" y="100" font-family="monospace" font-size="16" fill="#a855f7" text-anchor="middle">ARIA: 5-Agent Release Topology</text>
  <!-- BIA -->
  <rect x="80" y="150" width="150" height="100" rx="6" fill="#070b14" stroke="#34d399" stroke-width="2"/>
  <text x="155" y="175" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">BIA</text>
  <text x="155" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Build Intelligence</text>
  <text x="155" y="215" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Risk Scoring</text>
  <!-- COA -->
  <rect x="250" y="150" width="150" height="100" rx="6" fill="#070b14" stroke="#38bdf8" stroke-width="2"/>
  <text x="325" y="175" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">COA</text>
  <text x="325" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">CI Orchestration</text>
  <text x="325" y="215" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Test Scheduler</text>
  <!-- RCA -->
  <rect x="420" y="150" width="150" height="100" rx="6" fill="#070b14" stroke="#818cf8" stroke-width="2"/>
  <text x="495" y="175" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle">RCA</text>
  <text x="495" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Release Control</text>
  <text x="495" y="215" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Gates & Go/No-Go</text>
  <!-- DCA -->
  <rect x="590" y="150" width="150" height="100" rx="6" fill="#070b14" stroke="#fbbf24" stroke-width="2"/>
  <text x="665" y="175" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">DCA</text>
  <text x="665" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Deployment Canary</text>
  <text x="665" y="215" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Blast Radius</text>
  <!-- IRA -->
  <rect x="325" y="300" width="150" height="100" rx="6" fill="#070b14" stroke="#a855f7" stroke-width="2"/>
  <text x="400" y="325" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">IRA</text>
  <text x="400" y="345" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Incident Response</text>
  <text x="400" y="365" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">AFP Feedback</text>
  <!-- AFP Label -->
  <text x="400" y="450" font-family="monospace" font-size="14" fill="#a855f7" text-anchor="middle">Attributable Feedback Protocol (AFP)</text>
  <text x="400" y="475" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Cryptographic lineage: Stack Trace → Commit → Test Suite → Risk Score</text>
  <!-- Arrows -->
  <line x1="230" y1="200" x2="250" y2="200" stroke="#34d399" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="400" y1="200" x2="420" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="570" y1="200" x2="590" y2="200" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="250" x2="400" y2="300" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow4)"/>
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34d399"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#818cf8"/></marker>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/></marker>
  </defs>
</svg>
