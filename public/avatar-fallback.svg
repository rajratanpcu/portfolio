<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg-grad)" />
  <!-- Decorative Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ring-grad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  <!-- Inner Glow Circle -->
  <circle cx="100" cy="100" r="76" fill="#070b14" opacity="0.75" />
  <!-- Monogram Initials -->
  <text x="100" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">RR</text>
  <!-- Technical Eyebrow -->
  <text x="100" y="148" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">RAJ RATAN</text>
</svg>
