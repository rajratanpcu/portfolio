<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="coursera-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="coursera-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>
    <linearGradient id="coursera-secondary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7FF9" />
      <stop offset="100%" stop-color="#0056D2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#coursera-bg)" />
  <rect width="800" height="500" rx="12" fill="none" stroke="url(#coursera-accent)" stroke-width="2" opacity="0.3" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="6" rx="12" fill="url(#coursera-accent)" />

  <!-- Coursera Logo Area -->
  <g transform="translate(60, 60)">
    <!-- Coursera "C" Logo -->
    <circle cx="45" cy="45" r="40" fill="#0056D2" />
    <path d="M65,30 A25,25 0 0,1 65,70 A25,25 0 0,0 35,40" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="45" cy="45" r="8" fill="#0056D2" />
  </g>

  <!-- Certificate Title -->
  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Coursera
  </text>

  <!-- Course Title -->
  <text x="60" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#2D7FF9">
    Introduction to Operating Systems Specialization
  </text>

  <!-- Divider -->
  <line x1="60" y1="230" x2="740" y2="230" stroke="#333333" stroke-width="1" />

  <!-- Details Grid -->
  <g font-family="ui-monospace, monospace" font-size="14" fill="#cccccc">
    <text x="60" y="265" fill="#888888">ISSUED:</text>
    <text x="200" y="265" fill="#ffffff">October 2026</text>

    <text x="60" y="295" fill="#888888">CREDENTIAL ID:</text>
    <text x="200" y="295" fill="#2D7FF9" font-size="12">27XKY3SEP9OV</text>

    <text x="60" y="325" fill="#888888">ISSUER:</text>
    <text x="200" y="325" fill="#ffffff">Coursera</text>

    <text x="60" y="355" fill="#888888">VERIFICATION:</text>
    <text x="200" y="355" fill="#2D7FF9" font-size="11">coursera.org/verify/specialization/27XKY3SEP9OV</text>
  </g>

  <!-- Topics Covered -->
  <g transform="translate(60, 385)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cccccc">
    <text x="0" y="0" fill="#888888" font-weight="600">TOPICS COVERED:</text>
    <text x="0" y="25" fill="#ffffff">• Operating System Fundamentals</text>
    <text x="0" y="48" fill="#ffffff">• Virtualization & Memory Management</text>
    <text x="0" y="71" fill="#ffffff">• Concurrency & Persistence</text>
    <text x="0" y="94" fill="#ffffff">• Distributed Systems</text>
  </g>

  <!-- Verification Badge -->
  <g transform="translate(60, 445)">
    <rect width="300" height="40" rx="6" fill="#0056D2" opacity="0.2" stroke="#0056D2" stroke-width="1" />
    <text x="150" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2D7FF9" text-anchor="middle">VERIFIED ON COURSERA</text>
  </g>

  <!-- Footer -->
  <text x="400" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#555555" text-anchor="middle">
    This is a preview representation. View the official credential at coursera.org
  </text>
</svg>