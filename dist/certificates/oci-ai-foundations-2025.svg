<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg)"/>

  <!-- Outer Decorative Border -->
  <rect x="25" y="25" width="750" height="500" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="35" y="35" width="730" height="480" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Oracle Brand Top Header -->
  <g transform="translate(60, 75)">
    <!-- Oracle stylized wordmark -->
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#f87171" letter-spacing="4">ORACLE</text>
    <text x="140" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">UNIVERSITY</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="280" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="monospace" font-size="12" fill="#38bdf8" font-weight="bold">OFFICIAL CERTIFICATION OF RECOGNITION</text>
  </g>

  <!-- Recipient -->
  <g transform="translate(60, 215)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">This is certified that</text>
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">Raj Ratan</text>
    <text x="0" y="75" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">has successfully demonstrated foundational proficiency in</text>

    <!-- Certification Title -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">
      Oracle Cloud Infrastructure 2025 Certified AI Foundations Associate
    </text>
  </g>

  <!-- Competencies -->
  <g transform="translate(60, 375)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1">VALIDATED COMPETENCIES:</text>
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">
      Generative AI Foundations • Large Language Models (LLMs) • OCI AI Services • Vector Search
    </text>
  </g>

  <!-- Footer metadata & seal -->
  <g transform="translate(60, 465)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#64748b">ISSUER: Oracle Corporation</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#64748b">ISSUE YEAR: 2025 • STATUS: ACTIVE &amp; VERIFIED</text>
  </g>

  <!-- Right Seal Graphics -->
  <g transform="translate(670, 420)">
    <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">CERTIFIED</text>
    <text x="0" y="10" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">2025</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ORACLE AI</text>
  </g>
</svg>
